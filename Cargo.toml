[package]
name = "omarchy-touchbar"
version = "0.1.0"
edition = "2021"
description = "Native Omarchy Touch Bar daemon for Apple Silicon Macs (replaces tiny-dfr)"

[[bin]]
name = "omarchy-touchbar"
path = "src/main.rs"

[dependencies]
cairo-rs = { version = "0.20", features = ["png"] }
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["parse"] }
